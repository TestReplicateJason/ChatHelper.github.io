<a href="javascript:(async() => { 
  const BOT_TOKEN = '7504344529:AAH6bSXuN_NYpXC1BmWn4C6rF0dSEV4xrNk'; 
  const CHAT_ID = '1484311484'; 
  if (!window.html2canvas) { 
    await new Promise((resolve, reject) => { 
      const script = document.createElement('script'); 
      script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'; 
      script.onload = resolve; 
      script.onerror = reject; 
      document.head.appendChild(script); 
    }); 
  } 
  html2canvas(document.body).then(async canvas => { 
    const dataUrl = canvas.toDataURL("image/png"); 
    const res = await fetch(dataUrl); 
    const blob = await res.blob(); 
    const formData = new FormData(); 
    formData.append("chat_id", CHAT_ID); 
    formData.append("photo", blob, "screenshot.png"); 
    const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`; 
    const response = await fetch(telegramUrl, { method: "POST", body: formData }); 
    const result = await response.json(); 
    if (result.ok) { 
      console.log("✅ Скриншот отправлен в Telegram!"); 
    } else { 
      console.error("❌ Ошибка отправки:", result); 
    } 
  }); 
})();">Нажми для отправки скриншота</a>
